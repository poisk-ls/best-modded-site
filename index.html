<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="all.min.css" />
        <style>
            .glass-card {
                background: rgba(15, 23, 42, 0.7);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .status-glow {
                box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0% { opacity: 1; }
                50% { opacity: 0.7; }
                100% { opacity: 1; }
            }
            .hidden-row { display: none; }
        </style>
    </head>
    <body class="min-h-screen bg-[#0b0f1a] text-slate-200 font-sans p-4 sm:p-8">

        <div class="max-w-5xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tight">
                        Archive <span class="text-indigo-500">Outbound</span>
                    </h1>
                    <p class="text-slate-400 font-medium mt-2">Verified Modded Platforms Directory</p>
                </div>
                <button 
                    onclick="toggleDirectory()" 
                    id="actionBtn"
                    class="w-full md:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/20 transition-all active:scale-95"
                >
                    See all sites
                </button>
            </div>

            <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-800/40">
                                <th class="px-6 py-5 text-xs uppercase font-bold text-indigo-400 tracking-widest border-b border-slate-700">Site Name</th>
                                <th class="px-6 py-5 text-xs uppercase font-bold text-indigo-400 tracking-widest border-b border-slate-700">Rating</th>
                                <th class="px-6 py-5 text-xs uppercase font-bold text-indigo-400 tracking-widest border-b border-slate-700">Status</th>
                            </tr>
                        </thead>
                        <tbody id="directoryBody" class="divide-y divide-slate-800/50">
                            <tr class="hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-cyan-400"><a href="https://an1.com" target="_blank">AN1</a></td>
                                <td class="px-6 py-4 text-slate-400">10/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">100%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-cyan-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-amber-400"><a href="https://platinmods.com/" target="_blank">Platinmods</a></td>
                                <td class="px-6 py-4 text-slate-400">10/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">100%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-amber-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-blue-400"><a href="https://phcorner.org/" target="_blank">PHCorner</a></td>
                                <td class="px-6 py-4 text-slate-400">10/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">100%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-blue-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-emerald-400"><a href="https://modyolo.com" target="_blank">Modyolo</a></td>
                                <td class="px-6 py-4 text-slate-400">9/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">90%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-emerald-500" style="width: 90%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hidden-row hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-indigo-400"><a href="https://apkmody.com" target="_blank">Apkmody</a></td>
                                <td class="px-6 py-4 text-slate-400">8.9/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">89%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-indigo-500" style="width: 89%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hidden-row hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-pink-400"><a href="https://happymod.com" target="_blank">Happymod</a></td>
                                <td class="px-6 py-4 text-slate-400">8.9/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">89%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-pink-500" style="width: 89%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hidden-row hover:bg-white/[0.02] transition-colors">
                                <td class="px-6 py-4 font-bold text-rose-400"><a href="https://modhello.com" target="_blank">Modhello</a></td>
                                <td class="px-6 py-4 text-slate-400">10/10</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-10">100%</span>
                                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                                            <div class="h-full bg-rose-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-8 text-center text-slate-500 text-sm">
                &copy; 2026 poisk-ls | Developed for Mobile Logistics Workflow
            </div>
        </div>

        <script>
            function toggleDirectory() {
                const hiddenRows = document.querySelectorAll('.hidden-row');
                const btn = document.getElementById('actionBtn');
                let isHidden = true;

                hiddenRows.forEach(row => {
                    if (row.style.display === 'table-row') {
                        row.style.display = 'none';
                        isHidden = true;
                    } else {
                        row.style.display = 'table-row';
                        isHidden = false;
                    }
                });

                btn.innerText = isHidden ? 'See all sites' : 'Show less';
                btn.classList.toggle('bg-slate-700');
            }
        </script>
    </body>
</html>
