<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="all.min.css" />
        <style>
            .glass-card {
                background: rgba(15, 23, 42, 0.75);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .hidden-row { display: none; }
            .status-glow { box-shadow: 0 0 10px rgba(99, 102, 241, 0.4); }
        </style>
    </head>
    <body class="min-h-screen bg-[#0f172a] text-slate-200 font-sans p-4">

        <div class="max-w-3xl mx-auto mt-8">
            <div class="flex items-center justify-between mb-6 px-2">
                <div>
                    <h3 class="font-bold text-xl text-white tracking-tight">Best Modded Sites</h3>
                    <p class="text-slate-500 text-xs uppercase tracking-widest mt-1">Verified Directory</p>
                </div>
                <button 
                    onclick="toggleRows()" 
                    id="toggleBtn"
                    class="text-[10px] font-bold uppercase tracking-tighter px-3 py-1.5 border border-slate-700 rounded-md hover:bg-slate-800 transition-all text-slate-400 hover:text-white"
                >
                    See All
                </button>
            </div>

            <div class="glass-card rounded-xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-800/50">
                                <th class="px-5 py-4 text-[11px] uppercase font-bold text-indigo-400 border-b border-slate-700/50">Site Name</th>
                                <th class="px-5 py-4 text-[11px] uppercase font-bold text-indigo-400 border-b border-slate-700/50">Rate</th>
                                <th class="px-5 py-4 text-[11px] uppercase font-bold text-indigo-400 border-b border-slate-700/50">Status</th>
                            </tr>
                        </thead>
                        <tbody id="siteList" class="divide-y divide-slate-800/40">
                            <tr class="hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-cyan-400"><a href="https://an1.com" target="_blank">an1</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">10/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">100%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-cyan-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-amber-400"><a href="https://platinmods.com/" target="_blank">Platinmods</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">10/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">100%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-amber-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-blue-400"><a href="https://phcorner.org/" target="_blank">PHCorner</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">10/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">100%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-blue-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-emerald-400"><a href="https://modyolo.com" target="_blank">Modyolo</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">9/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">90%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-emerald-500" style="width: 90%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hidden-row hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-indigo-400"><a href="https://apkmody.com" target="_blank">Apkmody</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">8.9/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">89%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-indigo-500" style="width: 89%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hidden-row hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-pink-400"><a href="https://happymod.com" target="_blank">Happymod</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">8.9/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">89%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-pink-500" style="width: 89%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hidden-row hover:bg-white/[0.02]">
                                <td class="px-5 py-3 text-sm font-medium text-rose-400"><a href="https://modhello.com" target="_blank">Modhello</a></td>
                                <td class="px-5 py-3 text-sm text-slate-400">10/10</td>
                                <td class="px-5 py-3">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold w-8 text-slate-300">100%</span>
                                        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                            <div class="h-full bg-rose-500 status-glow" style="width: 100%"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <footer class="mt-10 py-4 border-t border-slate-800/60 text-center">
                <p class="text-[11px] text-slate-600 font-bold uppercase tracking-widest">
                    &copy; 2026 poisk-ls / Notus JS
                </p>
            </footer>
        </div>

        <script>
            function toggleRows() {
                const hiddenRows = document.querySelectorAll('.hidden-row');
                const btn = document.getElementById('toggleBtn');
                let isHidden = true;

                hiddenRows.forEach(row => {
                    if (row.style.display === 'table-row') {
                        row.style.display = 'none';
                        isHidden = true;
                    } else {
                        row.style.display = 'table-row';
                        isHidden = false;
                    }
                });

                btn.innerText = isHidden ? 'See All' : 'Collapse';
            }
        </script>
    </body>
</html>
